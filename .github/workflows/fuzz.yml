name: "Fuzz Testing"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  NIGHTLY_VERSION: nightly-2026-03-13

jobs:
  fuzz:
    if: contains(github.event.pull_request.labels.*.name, 'fuzz')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da052e410add48 # v1.13.0
        with:
          toolchain: ${{ env.NIGHTLY_VERSION }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Cache Rust dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            fuzz/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-
            ${{ runner.os }}-cargo-

      - name: Fuzz fuzz_idl_json (30s)
        id: fuzz_idl_json
        continue-on-error: true
        run: cargo +${{ env.NIGHTLY_VERSION }} fuzz run fuzz_idl_json -- -max_total_time=30
        working-directory: fuzz

      - name: Fuzz fuzz_instruction_data (30s)
        id: fuzz_instruction_data
        continue-on-error: true
        run: cargo +${{ env.NIGHTLY_VERSION }} fuzz run fuzz_instruction_data -- -max_total_time=30
        working-directory: fuzz

      - name: Fuzz fuzz_transaction (30s)
        id: fuzz_transaction
        continue-on-error: true
        run: cargo +${{ env.NIGHTLY_VERSION }} fuzz run fuzz_transaction -- -max_total_time=30
        working-directory: fuzz

      - name: Label PR on fuzz failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ steps.fuzz_idl_json.outcome }}" = "failure" ] \
             || [ "${{ steps.fuzz_instruction_data.outcome }}" = "failure" ] \
             || [ "${{ steps.fuzz_transaction.outcome }}" = "failure" ]; then
            gh pr edit "$PR_NUMBER" --add-label fuzz-failure || true
          else
            gh pr edit "$PR_NUMBER" --remove-label fuzz-failure || true
          fi
